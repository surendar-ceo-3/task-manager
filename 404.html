<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Task Manager</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      const path = location.pathname.substring('/task-manager/'.length);
      const redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect !== path) {
        history.replaceState(null, null, '/task-manager/' + redirect);
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
